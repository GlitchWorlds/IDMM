<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=350" />
  <title>IDMM Download Manager</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 350px;
      min-height: 450px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e293b;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }
    .header-icon {
      font-size: 18px;
      color: #3b82f6;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
      white-space: nowrap;
    }
    .header-badge {
      font-size: 10px;
      color: #94a3b8;
      background: #334155;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .header-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .header-status.online { background: #22c55e; }
    .header-status.offline { background: #ef4444; }
    .header-status.checking { background: #f59e0b; animation: pulse 1s infinite; }

    /* Sections */
    .section {
      padding: 10px 16px;
      flex-shrink: 0;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #94a3b8;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .section-title .count {
      font-size: 10px;
      color: #64748b;
      background: #334155;
      padding: 0 6px;
      border-radius: 8px;
      font-weight: 500;
    }

    /* Lists */
    .download-list, .links-list {
      max-height: 180px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #475569 transparent;
    }
    .download-item, .link-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      margin-bottom: 4px;
      transition: border-color 0.15s;
    }
    .download-item:hover, .link-item:hover {
      border-color: #475569;
    }

    .item-icon {
      font-size: 13px;
      color: #64748b;
      flex-shrink: 0;
      width: 18px;
      text-align: center;
    }
    .item-info {
      flex: 1;
      min-width: 0;
    }
    .item-name {
      font-size: 12px;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.3;
    }
    .item-meta {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 1px;
    }
    .item-actions {
      flex-shrink: 0;
    }

    /* Progress Bar */
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #334155;
      border-radius: 2px;
      margin-top: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #3b82f6;
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .progress-fill.paused { background: #f59e0b; }
    .progress-fill.error { background: #ef4444; }
    .progress-fill.completed { background: #22c55e; }

    /* Buttons */
    .btn {
      border: none;
      cursor: pointer;
      font-size: 11px;
      border-radius: 5px;
      padding: 4px 10px;
      font-weight: 500;
      transition: background 0.15s, opacity 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: inherit;
    }
    .btn:active {
      transform: scale(0.97);
    }
    .btn-sm {
      padding: 3px 8px;
      font-size: 11px;
    }
    .btn-icon {
      background: transparent;
      color: #94a3b8;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 14px;
      line-height: 1;
    }
    .btn-icon:hover { background: #334155; color: #e2e8f0; }
    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }
    .btn-primary:hover { background: #2563eb; }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover { background: #475569; }

    /* Footer */
    .footer {
      padding: 10px 16px 14px;
      border-top: 1px solid #334155;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
      margin-top: auto;
    }

    /* Add URL row */
    .add-url-row {
      flex: 1;
      min-width: 0;
      display: flex;
      gap: 4px;
    }
    .add-url-input {
      flex: 1;
      min-width: 0;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 5px;
      color: #e2e8f0;
      padding: 5px 8px;
      font-size: 11px;
      outline: none;
      font-family: inherit;
    }
    .add-url-input:focus { border-color: #3b82f6; }
    .add-url-input::placeholder { color: #64748b; }

    /* States */
    .empty-state {
      padding: 12px 8px;
      text-align: center;
      color: #64748b;
      font-size: 12px;
    }
    .loading-state {
      padding: 12px 8px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }
    .loading-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-left: 6px;
      border: 2px solid #475569;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: middle;
    }
    .error-state {
      padding: 10px 8px;
      text-align: center;
      color: #f87171;
      font-size: 11px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <span class="header-icon">&#x25BC;</span>
    <span class="header-title">IDMM Download Manager</span>
    <span id="versionBadge" class="header-badge">1.3.0</span>
    <span id="statusDot" class="header-status checking" title="Checking server..."></span>
  </div>

  <!-- Page Links -->
  <div class="section">
    <div class="section-title">
      &#x1F4C4; Page Links
      <span id="linksCount" class="count">0</span>
    </div>
    <div id="linksContainer" class="links-list">
      <div class="loading-state">
        Scanning page for links<span class="loading-spinner"></span>
      </div>
    </div>
  </div>

  <!-- Active Downloads -->
  <div class="section">
    <div class="section-title">
      &#x26A1; Active Downloads
      <span id="downloadsCount" class="count">0</span>
    </div>
    <div id="downloadsContainer" class="download-list">
      <div class="loading-state">
        Loading<span class="loading-spinner"></span>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="add-url-row">
      <input id="addUrlInput" class="add-url-input" type="text" placeholder="Paste URL..." />
      <button id="addUrlBtn" class="btn btn-primary btn-sm" title="Add URL">+</button>
    </div>
    <button id="settingsBtn" class="btn-icon" title="Settings">&#x2699;</button>
    <button id="openAppBtn" class="btn-icon" title="Open IDMM App">&#x2197;</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
